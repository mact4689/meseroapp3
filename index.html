<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Mobile App Config -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="format-detection" content="telephone=no">
  
  <!-- SEO Meta Tags -->
  <title>MeseroApp | Gestión Inteligente para Restaurantes y Menú Digital</title>
  <meta name="description"
    content="Optimiza tu restaurante con MeseroApp. Gestión de pedidos en tiempo real, cocina (KDS), mesas y menú digital interactivo. La solución completa para hostelería moderna.">
  <meta name="keywords" content="restaurante, gestión, menú digital, pedidos online, KDS, mesero app, hostelería">
  <link rel="canonical" href="https://meseroapp.com" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://meseroapp.com">
  <meta property="og:title" content="MeseroApp | Gestión Inteligente para Restaurantes">
  <meta property="og:description" content="Gestión de pedidos, cocina y mesas en tiempo real. ¡Prueba el menú digital hoy!">
  <meta property="og:image" content="/logo.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://meseroapp.com">
  <meta property="twitter:title" content="MeseroApp | Gestión Inteligente para Restaurantes">
  <meta property="twitter:description" content="Gestión de pedidos, cocina y mesas en tiempo real. ¡Prueba el menú digital hoy!">
  <meta property="twitter:image" content="/logo.png">

  <!-- PWA Icons -->
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/logo.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Structured Data (Organization) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "MeseroApp",
      "operatingSystem": "Web, Android, iOS",
      "applicationCategory": "BusinessApplication",
      "description": "Sistema de gestión para restaurantes con pedidos en tiempo real y menú digital.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
  </script>
</head>

<body class="bg-brand-900 text-brand-900 antialiased selection:bg-accent-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
